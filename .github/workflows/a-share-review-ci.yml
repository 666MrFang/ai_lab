name: a-share-review-ci

on:
  push:
    branches: ["master"]
    paths:
      - "a-share-review/**"
      - ".github/workflows/a-share-review-ci.yml"
  pull_request:
    paths:
      - "a-share-review/**"
      - ".github/workflows/a-share-review-ci.yml"
  workflow_dispatch:

jobs:
  deterministic-product-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a-share-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema pandas "mcp>=1.0"
      - name: Run deterministic product suite
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          review_memory/tests
          product/tests
          runner/tests
          collector/tests
          eval/tests
          experiments/tests
      - name: Run Market MCP suite in isolated import namespace
        working-directory: a-share-review/market-mcp
        env:
          PYTHONPATH: .
        run: pytest -q tests
