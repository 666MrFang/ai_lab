name: a-share-review-ci

on:
  push:
    paths:
      - "a-share-review/**"
      - ".github/workflows/a-share-review-ci.yml"
  pull_request:
    paths:
      - "a-share-review/**"
      - ".github/workflows/a-share-review-ci.yml"

jobs:
  deterministic-product-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a-share-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest jsonschema
      - name: Review memory / product / runner / collector / eval
        run: |
          pytest -q             review_memory/tests             product/tests             runner/tests             collector/tests             eval/tests \
            market-mcp/tests
